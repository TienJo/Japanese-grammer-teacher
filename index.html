<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<title>AI Japanese Teacher</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:
"Noto Sans TC",
Arial,
sans-serif;

background:
linear-gradient(
135deg,
#eef2ff,
#ffffff
);

min-height:100vh;

}



.container{

width:900px;
max-width:95%;

margin:auto;

padding:40px 0;

}



.card{

background:white;

border-radius:20px;

padding:35px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

margin-bottom:25px;

}



h1{

font-size:36px;

}



button{

border:none;

background:#111827;

color:white;

padding:14px 25px;

border-radius:12px;

cursor:pointer;

font-size:16px;

}



button:hover{

opacity:.85;

}



.hidden{

display:none;

}



.center{

text-align:center;

}




/* login */


.logo{

font-size:70px;

}



.google-btn{

background:white;

color:#333;

border:1px solid #ddd;

}





/* step */

.progress{

height:8px;

background:#eee;

border-radius:20px;

overflow:hidden;

}



.progress-bar{

height:100%;

background:#111827;

width:25%;

}



.option-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:15px;

}



.option{

padding:20px;

border:2px solid #eee;

border-radius:15px;

cursor:pointer;

text-align:center;

transition:.2s;

}



.option:hover,
.option.active{

border-color:#111827;

background:#f8fafc;

}



input,
textarea{

width:100%;

padding:14px;

border-radius:10px;

border:1px solid #ddd;

font-size:16px;

margin-top:10px;

}



.chat{

height:450px;

overflow-y:auto;

background:#f8fafc;

padding:20px;

border-radius:15px;

}



.msg{

padding:15px;

margin:10px 0;

border-radius:15px;

}



.ai{

background:#e0e7ff;

}



.user{

background:#eee;

text-align:right;

}



.lesson-title{

font-size:25px;

font-weight:bold;

}


</style>


</head>


<body>


<div class="container">



<!-- LOGIN -->


<div class="card center" id="loginPage">


<div class="logo">
🇯🇵
</div>


<h1>
AI Japanese Teacher
</h1>


<p>
你的私人 AI 日語老師
<br>
每天生成專屬課程與測驗
</p>



<button class="google-btn"
onclick="googleLogin()">

使用 Google 登入

</button>


<br><br>


<input
id="clientId"
placeholder="Google Client ID">


</div>





<!-- SETUP -->


<div class="card hidden" id="setupPage">


<h1>
建立你的日語學習計畫
</h1>


<div class="progress">

<div class="progress-bar"
id="progressBar">

</div>

</div>



<br>



<!-- STEP 1 -->


<div id="step1">


<h2>
你的日語目標？
</h2>


<div class="option-grid">


<div class="option"
onclick="chooseGoal('JLPT')">

🎌
<br>
JLPT考試

</div>


<div class="option"
onclick="chooseGoal('日常交流')">

🗣
<br>
日常交流

</div>



<div class="option"
onclick="chooseGoal('工作日語')">

💼
<br>
工作

</div>


<div class="option"
onclick="chooseGoal('日本旅行')">

✈️
<br>
旅行

</div>



<div class="option"
onclick="chooseGoal('動漫遊戲')">

🎮
<br>
興趣

</div>


<div class="option"
onclick="customGoal()">

✏️
<br>
自訂

</div>


</div>


<textarea
id="goalInput"
placeholder="輸入你的學習目標，例如：
一年內可以和日本朋友自然聊天">

</textarea>



<br>


<button onclick="nextStep()">

下一步

</button>



</div>





<!-- STEP 2 -->


<div id="step2"
class="hidden">


<h2>
目前日語程度？
</h2>


<div class="option-grid">


<div class="option"
onclick="setLevel('五十音')">

🌱
<br>
五十音

</div>


<div class="option"
onclick="setLevel('N5')">

N5

</div>


<div class="option"
onclick="setLevel('N4')">

N4

</div>


<div class="option"
onclick="setLevel('N3')">

N3

</div>


</div>


<br>


<button onclick="nextStep()">

下一步

</button>


</div>





<!-- STEP3 -->


<div id="step3"
class="hidden">


<h2>
每天學習時間？
</h2>


<div class="option-grid">


<div class="option"
onclick="setTime('15分鐘')">

15分鐘

</div>


<div class="option"
onclick="setTime('30分鐘')">

30分鐘

</div>


<div class="option"
onclick="setTime('60分鐘')">

1小時

</div>



</div>


<br>


<button onclick="generatePlan()">

開始建立計畫

</button>



</div>



</div>





<!-- DASHBOARD -->


<div class="card hidden"
id="dashboard">


<h1>
我的日語計畫
</h1>


<div id="planInfo"></div>


<button onclick="startLesson()">

開始今天學習

</button>


</div>





<!-- LESSON -->


<div class="card hidden"
id="lesson">


<div class="lesson-title"
id="lessonTitle">

</div>


<div class="chat"
id="chat">

</div>



<input
id="question"
placeholder="詢問日語老師">


<button onclick="askAI()">

送出

</button>


<br><br>


<button onclick="quiz()">

開始測驗

</button>


</div>



<!-- QUIZ -->


<div class="card hidden"
id="quizBox">


<h2>
今日測驗
</h2>


<div id="quizContent"></div>


</div>




</div>


<script>
/* 下一段 JS */
</script>


</body>

</html>
