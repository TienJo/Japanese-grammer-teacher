<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>日語文法學習助手</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f7f9fa; color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .hidden { display: none; }
    button { padding: 8px 16px; border: none; background: #2563eb; color: white; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #94a3b8; }
    input, select, textarea { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
    #chat-box { height: 350px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 12px; border-radius: 4px; background: #fafafa; margin-bottom: 12px; }
    .msg { margin-bottom: 12px; line-height: 1.5; white-space: pre-wrap; }
    .msg.bot { color: #1e293b; }
    .msg.user { color: #2563eb; text-align: right; }
    .quiz-card { border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; margin-top: 10px; background: #f8fafc; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <h1>日語文法學習助手</h1>

  <!-- 設定與授權區塊 -->
  <div id="auth-section" class="card">
    <h3>初始授權與金鑰設定</h3>
    <label>Google Client ID:</label>
    <input type="text" id="client-id" placeholder="xxxx.apps.googleusercontent.com">
    <label>Gemini API Key:</label>
    <input type="password" id="gemini-key" placeholder="AIzaSy...">
    <button id="btn-auth">連接 Google Drive 並儲存設定</button>
  </div>

  <!-- 計畫設定區塊 -->
  <div id="plan-setup-section" class="card hidden">
    <h3>客製化學習計畫</h3>
    <label>學習目標：</label>
    <input type="text" id="plan-goal" placeholder="例如：JLPT N3 核心文法、日常對話基礎">
    <label>規劃天數：</label>
    <input type="number" id="plan-days" value="14" min="1" max="60">
    <button id="btn-generate-plan">由 Gemini 規劃每日標題</button>
  </div>

  <!-- 學習主介面 -->
  <div id="study-section" class="card hidden">
    <h2 id="today-title">載入中...</h2>
    <div id="chat-box"></div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="user-input" placeholder="有不懂的地方可以直接提問，或點擊開始測驗...">
      <button id="btn-send">傳送</button>
      <button id="btn-start-quiz" style="background: #059669;">開始測驗</button>
    </div>
    <div id="quiz-container"></div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "https://esm.run/@google/genai";

    let state = {
      tokenClient: null,
      accessToken: null,
      geminiKey: "",
      driveFileId: null,
      studyData: null
    };

    const SCOPES = "https://www.googleapis.com/auth/drive.file";

    // 1. 初始化 Google Drive 授權
    document.getElementById("btn-auth").addEventListener("click", () => {
      const clientId = document.getElementById("client-id").value.trim();
      state.geminiKey = document.getElementById("gemini-key").value.trim();

      if (!clientId || !state.geminiKey) {
        alert("請完整輸入 Client ID 與 Gemini API Key");
        return;
      }

      state.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) return;
          state.accessToken = resp.access_token;
          await loadOrCreateUserData();
        }
      });
      state.tokenClient.requestAccessToken();
    });

    // 2. Google Drive 讀寫模組
    async function loadOrCreateUserData() {
      // 搜尋檔案是否存在
      const q = encodeURIComponent("name = 'japanese_study_progress.json' and trashed = false");
      const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}`, {
        headers: { Authorization: `Bearer ${state.accessToken}` }
      });
      const listData = await listRes.json();

      if (listData.files && listData.files.length > 0) {
        state.driveFileId = listData.files[0].id;
        const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${state.driveFileId}?alt=media`, {
          headers: { Authorization: `Bearer ${state.accessToken}` }
        });
        state.studyData = await fileRes.json();
      } else {
        // 建立新檔案
        state.studyData = {
          geminiKey: state.geminiKey,
          plan: null,
          currentDayIndex: 0,
          records: {}
        };
        const metadata = { name: "japanese_study_progress.json", mimeType: "application/json" };
        const form = new FormData();
        form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
        form.append("file", new Blob([JSON.stringify(state.studyData)], { type: "application/json" }));

        const createRes = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
          method: "POST",
          headers: { Authorization: `Bearer ${state.accessToken}` },
          body: form
        });
        const created = await createRes.json();
        state.driveFileId = created.id;
      }

      document.getElementById("auth-section").classList.add("hidden");
      renderFlow();
    }

    async function syncToDrive() {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${state.driveFileId}?uploadType=media`, {
        method: "PATCH",
        headers: {
          Authorization: `Bearer ${state.accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(state.studyData)
      });
    }

    // 3. 流程渲染控制
    function renderFlow() {
      if (!state.studyData.plan) {
        document.getElementById("plan-setup-section").classList.remove("hidden");
      } else {
        document.getElementById("plan-setup-section").classList.add("hidden");
        document.getElementById("study-section").classList.remove("hidden");
        loadDailyContent();
      }
    }

    // 4. 生成日程表 (Gemini API)
    document.getElementById("btn-generate-plan").addEventListener("click", async () => {
      const goal = document.getElementById("plan-goal").value;
      const days = document.getElementById("plan-days").value;
      const ai = new GoogleGenAI({ apiKey: state.geminiKey });

      const prompt = `請以日語教學專家身分，為目標為「${goal}」的學生設計 ${days} 天的學習大綱。
請只回傳 JSON 字串陣列，格式為 ["第 1 天: 主題", "第 2 天: 主題", ...]，不可帶任何額外 Markdown 標籤或說明。`;

      const response = await ai.models.generateContent({
        model: "gemini-2.5-flash",
        contents: prompt
      });

      const cleanText = response.text.replace(/```json/g, "").replace(/```/g, "").trim();
      state.studyData.plan = JSON.parse(cleanText);
      state.studyData.currentDayIndex = 0;
      await syncToDrive();
      renderFlow();
    });

    // 5. 每日學習與對話
    let chatSession = null;

    async function loadDailyContent() {
      const dayIdx = state.studyData.currentDayIndex;
      const title = state.studyData.plan[dayIdx];
      document.getElementById("today-title").innerText = title;

      appendMsg("系統", `正在生成【${title}】的今日教材...`);

      const ai = new GoogleGenAI({ apiKey: state.geminiKey });
      chatSession = ai.chats.create({
        model: "gemini-2.5-flash",
        config: {
          systemInstruction: `你是專業日語文法教師。請用親切清晰的方式解析文法、句型、動詞形態與助詞。`
        }
      });

      const prompt = `請為今日進度「${title}」給予完整教學內容，包含核心概念、句型接續結構、動詞形態變化、常混淆助詞辨析與 3 個實用例句。說明完後提醒學生不懂隨時提問，或是準備好了可點擊測驗按鈕。`;
      const res = await chatSession.sendMessage({ message: prompt });
      appendMsg("老師", res.text);
    }

    function appendMsg(role, text) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `msg ${role === "學生" ? "user" : "bot"}`;
      div.innerText = `${role}: \n${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById("btn-send").addEventListener("click", async () => {
      const input = document.getElementById("user-input");
      const val = input.value.trim();
      if (!val || !chatSession) return;
      appendMsg("學生", val);
      input.value = "";

      const res = await chatSession.sendMessage({ message: val });
      appendMsg("老師", res.text);
    });

    // 6. 生成與評估測驗
    document.getElementById("btn-start-quiz").addEventListener("click", async () => {
      const dayIdx = state.studyData.currentDayIndex;
      const title = state.studyData.plan[dayIdx];
      const ai = new GoogleGenAI({ apiKey: state.geminiKey });

      appendMsg("系統", "正在根據今日內容產生小考題目...");

      const prompt = `針對主題「${title}」出 2 題測驗，請嚴格輸出符合以下 JSON 格式：
[
  {
    "question": "題目描述",
    "options": ["A. 選項1", "B. 選項2", "C. 選項3", "D. 選項4"],
    "answer": "A",
    "explanation": "詳細解析"
  }
]`;

      const res = await ai.models.generateContent({
        model: "gemini-2.5-flash",
        contents: prompt
      });

      const cleanJson = res.text.replace(/```json/g, "").replace(/```/g, "").trim();
      const quizList = JSON.parse(cleanJson);
      renderQuiz(quizList);
    });

    function renderQuiz(list) {
      const container = document.getElementById("quiz-container");
      container.innerHTML = "<h3>今日隨堂測驗</h3>";

      list.forEach((q, idx) => {
        const div = document.createElement("div");
        div.className = "quiz-card";
        div.innerHTML = `
          <p><strong>第 ${idx + 1} 題：${q.question}</strong></p>
          ${q.options.map(opt => `<label><input type="radio" name="q_${idx}" value="${opt[0]}"> ${opt}</label><br>`).join("")}
          <button style="margin-top:8px;" id="sub_${idx}">看解答</button>
          <div id="exp_${idx}" class="hidden" style="margin-top:8px; color: #334155;">
            <p><strong>正確解答：${q.answer}</strong></p>
            <p>${q.explanation}</p>
          </div>
        `;
        container.appendChild(div);

        div.querySelector(`#sub_${idx}`).addEventListener("click", () => {
          document.getElementById(`exp_${idx}`).classList.remove("hidden");
        });
      });
    }
  </script>
</body>
</html>
